name: Contribution snake

# Draws the contribution graph as a snake in the README's colours and adds the
# two SVG files to the output branch, which the README shows.
on:
  schedule:
    - cron: "23 1 * * *" # daily; off the top of the hour, when runs queue longest
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions: {}

concurrency:
  group: snake-output
  cancel-in-progress: false

jobs:
  draw:
    # The outside action runs here, where the token cannot write anything.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Draw the snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: Krishpotanwar
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#27272a&color_dots=#ececef,#f6d9c4,#eeb48b,#d77d43,#a74e1b
            dist/github-contribution-grid-snake-dark.svg?color_snake=#e4e4e7&color_dots=#1b1f24,#4a2712,#7c3f1b,#b9612a,#e48444

      - name: Hold the snake still for people who ask for less motion
        run: |
          for f in dist/*.svg; do
            sed -i 's|</style>|@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>|' "$f"
            grep -q 'prefers-reduced-motion' "$f"
          done

      - name: Hand the files to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snake
          path: dist/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    # Only GitHub's own actions and the lines below run with write access.
    needs: draw
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the two SVG files to the output branch
    steps:
      - name: Check out the output branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: output
          path: output

      - name: Take the files from the draw job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snake
          path: dist

      - name: Add the files to the output branch
        run: |
          cp dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg output/
          cd output
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "The snake has not changed."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Update the contribution snake"
          git push -q origin HEAD:output
